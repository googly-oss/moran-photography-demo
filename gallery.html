<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MORAN — Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#080807;--white:#f1eee8;--grey:#96918a;--line:#292825;--serif:'Cormorant Garamond',serif;--sans:'DM Sans',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--white);font-family:var(--sans)}
a{color:inherit;text-decoration:none}.top{padding:24px 5vw;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);font-size:9px;letter-spacing:.2em;text-transform:uppercase}
main{padding:70px 5vw}.eyebrow{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:#77736c}.title{font:400 clamp(60px,10vw,130px)/.78 var(--serif);margin:20px 0 60px;letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.item{height:70vh;overflow:hidden}.item:nth-child(2n){margin-top:100px;height:58vh}.item img{width:100%;height:100%;object-fit:cover;display:block}.back{display:inline-block;margin-top:55px;padding:15px 20px;border:1px solid #5c5953;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
@media(max-width:700px){
  .top{padding:20px}.top span{font-size:8px}
  main{padding:55px 20px}.title{font-size:20vw;line-height:.8;margin:18px 0 38px}
  .grid{grid-template-columns:1fr;gap:12px}.item,.item:nth-child(2n){height:110vw;min-height:290px;max-height:440px;margin:0}.back{width:100%;text-align:center}
}
</style>
</head>
<body>
<header class="top"><a href="index.html">Moran Photography</a><a href="index.html#work">Back to portfolio</a></header>
<main>
<div class="eyebrow" id="eyebrow">Selected story</div>
