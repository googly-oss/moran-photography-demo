<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive — Premium Photography</title><link rel="stylesheet" href="style.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"></head><body class="gallery-page"><header><a class="logo" href="index.html">P<span>/</span>P</a><nav><a href="index.html">Home</a><a href="#archive">Archive</a><a href="https://wa.me/918638166831?text=Hi%20Premium%20Photography%2C%20I%27d%20like%20to%20enquire." target="_blank">Enquire</a></nav></header><main id="archive"><section class="gallery-intro"><div><div class="label">The visual archive</div><h1>Every frame<br><em>has a pulse.</em></h1></div><p>A living collection of weddings, portraits, pre-weddings, celebrations, films and brands.</p></section><div class="filters"><button data-filter="all" class="active">All</button><button data-filter="weddings">Weddings</button><button data-filter="preweddings">Pre-weddings</button><button data-filter="portraits">Portraits</button><button data-filter="events">Events</button><button data-filter="films">Films</button><button data-filter="brands">Brands</button></div><section class="masonry" id="grid"></section></main><div class="lightbox" id="lightbox"><button class="close">×</button><button class="prev">←</button><img id="lightImg"><button class="next">→</button><div class="lb-title"></div></div><script>const items=[['weddings','Wedding / I','../wedding-feature.jpg'],['preweddings','Pre-wedding / II','https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=1600&q=90'],['portraits','Portrait / III','https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=1200&q=90'],['events','Celebration / IV','https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1400&q=90'],['brands','Brand / V','https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1400&q=90'],['films','Film / VI','../video-reels-upload.jpg'],['portraits','Portrait / VII','https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=1200&q=90'],['preweddings','Pre-wedding / VIII','https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1400&q=90'],['weddings','Wedding / IX','https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=1500&q=90'],['events','Event / X','https://images.unsplash.com/photo-1507504031003-b417219a0fde?auto=format&fit=crop&w=1400&q=90'],['brands','Brand / XI','https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1400&q=90'],['portraits','Portrait / XII','https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=1200&q=90']];const grid=document.querySelector('#grid'),lb=document.querySelector('#lightbox'),li=document.querySelector('#lightImg'),title=document.querySelector('.lb-title');let shown=[],pos=0;function render(f='all'){shown=items.filter(x=>f==='all'||x[0]===f);grid.innerHTML=shown.map((x,i)=>`<figure class="gitem"><button onclick="openLb(${i})"><img loading="lazy" src="${x[2]}" alt="${x[1]}"><figcaption>${x[1]} <span>↗</span></figcaption></button></figure>`).join('')}function openLb(i){pos=i;show();lb.classList.add('show');document.body.classList.add('lock')}function show(){const x=shown[pos];li.src=x[2];title.textContent=x[1]}function closeLb(){lb.classList.remove('show');document.body.classList.remove('lock')}document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelector('.filters .active').classList.remove('active');b.classList.add('active');render(b.dataset.filter)});document.querySelector('.close').onclick=closeLb;document.querySelector('.next').onclick=()=>{pos=(pos+1)%shown.length;show()};document.querySelector('.prev').onclick=()=>{pos=(pos-1+shown.length)%shown.length;show()};document.addEventListener('keydown',e=>{if(!lb.classList.contains('show'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight'){pos=(pos+1)%shown.length;show()}if(e.key==='ArrowLeft'){pos=(pos-1+shown.length)%shown.length;show()}});render(new URLSearchParams(location.search).get('cat')||'all');</script></body></html>
